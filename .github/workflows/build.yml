name: Build Ashika Live TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle Projects
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon projects

      - name: Check App Tasks
        run: |
          ./gradlew --no-daemon :app:tasks --all

      - name: Build APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-Live-TV-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
