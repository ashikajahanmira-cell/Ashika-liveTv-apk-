name: Build Ashika Live TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Export Keystore Base64
        run: |
          mkdir -p keystore-backup
          base64 -w 0 "$HOME/.android/debug.keystore" \
            > keystore-backup/debug-keystore-base64.txt

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Generate SHA Fingerprints
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Private-Keystore-Backup
          path: keystore-backup/debug-keystore-base64.txt
          retention-days: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-Live-TV-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
