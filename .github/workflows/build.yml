name: Build Ashika Live TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Project Files
        run: |
          echo "PROJECT FILES"
          find . -maxdepth 3 -type f | sort

      - name: Show Gradle Configuration
        run: |
          echo "ROOT BUILD FILE"
          cat build.gradle.kts
          echo "APP BUILD FILE"
          cat app/build.gradle.kts
          echo "SETTINGS FILE"
          cat settings.gradle.kts

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashika-Live-TV-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
